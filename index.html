<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1a0638;--bg2:#050110;--gold:#ffd36b;--amber:#ff9a2e;--rose:#ff4f81;--text:#fff3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0638;--bg2:#050110}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg2);color:var(--text);font-family:Georgia,serif}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 75%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.poster{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4vh 5vw 3vh;text-align:center;pointer-events:none}
.mandala{position:absolute;top:46%;left:50%;width:min(130vw,95vh);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.42;animation:spin 90s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.top{z-index:2;letter-spacing:.5em;font-size:clamp(11px,2.6vw,16px);color:var(--gold);text-transform:uppercase;opacity:.9}
.mid{z-index:2}
.hindi{font-family:"Tiro Devanagari Hindi",serif;font-size:clamp(30px,8vw,64px);color:var(--amber);margin:0 0 .1em;text-shadow:0 0 24px rgba(255,140,40,.7)}
h1{font-family:"Cinzel Decorative",Georgia,serif;margin:0;font-size:clamp(40px,12vw,104px);line-height:1;
background:linear-gradient(100deg,#ffb347 0%,#fff2b0 25%,#ffd36b 45%,#ff7a45 65%,#fff2b0 85%,#ffb347 100%);background-size:250% 100%;
-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;filter:drop-shadow(0 0 18px rgba(255,170,60,.55))}
@keyframes shine{to{background-position:-250% 0}}
.tag{margin:.9em auto 0;max-width:30ch;font-style:italic;font-size:clamp(14px,3.6vw,22px);color:var(--text);opacity:.9}
.hint{font-size:clamp(10px,2.4vw,13px);letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-top:1.2em;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.diyas{z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,2.5vw,26px);width:100%}
.diya{width:clamp(48px,15vw,120px);overflow:visible}
.diya:nth-child(even){width:clamp(38px,11vw,92px)}
.flame{transform-origin:50px 52px;animation:flick 1.3s ease-in-out infinite alternate}
.diya:nth-child(2) .flame{animation-delay:-.4s}.diya:nth-child(3) .flame{animation-delay:-.9s}
.diya:nth-child(4) .flame{animation-delay:-.2s}.diya:nth-child(5) .flame{animation-delay:-.7s}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}30%{transform:scale(.92,1.08) rotate(2deg)}60%{transform:scale(1.05,.95) rotate(-1deg)}100%{transform:scale(.95,1.1) rotate(3deg)}}
.glow{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.mandala,h1,.flame,.glow,.hint{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="poster">
  <svg class="mandala" id="mandala" viewBox="-200 -200 400 400" aria-hidden="true"></svg>
  <div class="top">Festival of Lights</div>
  <div class="mid">
    <p class="hindi">शुभ दीपावली</p>
    <h1>Happy Diwali</h1>
    <p class="tag">May the light within you glow brighter than every diya tonight.</p>
    <div class="hint">Tap anywhere for fireworks</div>
  </div>
  <div class="diyas" id="diyas"></div>
</div>
<script>
// Mandala
(function(){
  var g='',i,n=16;
  for(var r=0;r<3;r++){
    var len=[170,125,80][r],w=[26,22,18][r],col=['#ff9a2e','#ff4f81','#ffd36b'][r],cnt=r==1?n:n;
    for(i=0;i<cnt;i++){
      var a=i*360/cnt+(r==1?360/cnt/2:0);
      g+='<path transform="rotate('+a+')" d="M0 -'+(len-60)+' Q'+w+' -'+(len-25)+' 0 -'+len+' Q-'+w+' -'+(len-25)+' 0 -'+(len-60)+'Z" fill="none" stroke="'+col+'" stroke-width="1.4"/>';
    }
  }
  for(i=0;i<48;i++){g+='<circle cx="0" cy="-188" r="2.4" fill="#ffd36b" transform="rotate('+(i*7.5)+')"/>'}
  g+='<circle r="186" fill="none" stroke="#ffd36b" stroke-width=".8" stroke-dasharray="2 6"/><circle r="40" fill="none" stroke="#ff9a2e" stroke-width="1.2"/>';
  document.getElementById('mandala').innerHTML=g;
})();
// Diyas
(function(){
  var h='';
  for(var i=0;i<5;i++){
    h+='<svg class="diya" viewBox="0 0 100 100"><defs><radialGradient id="gl'+i+'"><stop offset="0" stop-color="#ffcf70" stop-opacity=".95"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>'+
    '<linearGradient id="bw'+i+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#b8480f"/></linearGradient></defs>'+
    '<circle class="glow" cx="50" cy="48" r="46" fill="url(#gl'+i+')"/>'+
    '<g class="flame"><path d="M50 18 C62 36 66 46 50 56 C34 46 38 36 50 18Z" fill="#ff7a1a"/><path d="M50 30 C57 40 58 46 50 54 C42 46 43 40 50 30Z" fill="#ffe27a"/></g>'+
    '<path d="M12 58 Q50 54 88 58 Q84 84 50 88 Q16 84 12 58Z" fill="url(#bw'+i+')" stroke="#ffd36b" stroke-width="1.5"/>'+
    '<path d="M24 66 Q50 72 76 66" fill="none" stroke="#ffe9a8" stroke-width="1.5" stroke-dasharray="2 4"/>'+
    '<ellipse cx="50" cy="58" rx="38" ry="4" fill="#7a2c08"/></svg>';
  }
  document.getElementById('diyas').innerHTML=h;
})();
// Fireworks + sparkles
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,D,P=[],S=[];
function size(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
var cols=['#ffd36b','#ff9a2e','#ff4f81','#7df9ff','#c77dff','#fff3d6','#7dff9a'];
function burst(x,y){
  var c=cols[Math.random()*cols.length|0],c2=cols[Math.random()*cols.length|0],n=60+Math.random()*40|0,ring=Math.random()<.35;
  for(var i=0;i<n;i++){
    var a=Math.PI*2*i/n,s=ring?4.2:1.5+Math.random()*4.5;
    P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.012+Math.random()*.012,c:i%3?c:c2});
  }
}
function launch(x){
  var tx=x,ty=H*(.12+Math.random()*.35);
  S.push({x:x,y:H,ty:ty,vy:-(7+Math.random()*3),tx:tx});
}
function tap(e){var t=e.touches?e.touches[0]:e;launch(t.clientX);}
addEventListener('pointerdown',tap);
setInterval(function(){launch(W*(.1+Math.random()*.8))},1300);
for(var k=0;k<3;k++)setTimeout(function(){launch(W*(.15+Math.random()*.7))},k*500);
var stars=[];for(var s=0;s<90;s++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6});
var embers=[];for(var e=0;e<30;e++)embers.push({x:Math.random(),y:Math.random(),v:.15+Math.random()*.4,r:Math.random()*2+.8,p:Math.random()*6});
function frame(t){
  ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  stars.forEach(function(s){ctx.globalAlpha=.3+.5*Math.abs(Math.sin(t/900+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H*.8,s.r,0,7);ctx.fill()});
  embers.forEach(function(m){m.y-=m.v/H*2;m.x+=Math.sin(t/1000+m.p)*.0004;if(m.y<-.02){m.y=1.02;m.x=Math.random()}
    ctx.globalAlpha=.5;ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(m.x*W,m.y*H,m.r,0,7);ctx.fill()});
  for(var i=S.length-1;i>=0;i--){var r=S[i];r.y+=r.vy;r.vy*=.985;
    ctx.globalAlpha=1;ctx.fillStyle='#fff3d6';ctx.beginPath();ctx.arc(r.x,r.y,2.2,0,7);ctx.fill();
    if(r.y<=r.ty||r.vy>-1.2){burst(r.x,r.y);S.splice(i,1)}}
  for(i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.05;p.l-=p.d;
    if(p.l<=0){P.splice(i,1);continue}
    ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,1.8*p.l+.4,0,7);ctx.fill()}
  ctx.globalAlpha=1;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
